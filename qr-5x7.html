<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cedar Tap — 5x7 QR Cards</title>
<style>
  @page { size: letter portrait; margin: 0.25in; }
  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .no-print { display: none; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0ebe3; font-family:'Georgia',serif; padding:20px; }

  /* Two 5x7 cards side by side on letter */
  .sheet {
    display: grid;
    grid-template-columns: 5in 5in;
    gap: 0.3in;
    justify-content: center;
  }

  /* ── CARD 1: Cedar Tap Main Site ── */
  .card-main {
    width: 5in;
    height: 7in;
    background: #2d1b0e;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 0.45in 0.4in 0.35in;
    position: relative;
    overflow: hidden;
  }
  .card-main::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(200,134,10,0.08);
  }
  .card-main::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(200,134,10,0.06);
  }

  .main-top { text-align:center; z-index:1; }
  .main-wordmark {
    font-size: 11px; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(253,248,240,0.45); margin-bottom: 6px;
  }
  .main-title {
    font-size: 44px; color: #fdf8f0; letter-spacing: 2px;
    font-weight: normal; line-height: 1;
  }
  .main-rule {
    width: 48px; height: 2px; background: #c8860a;
    margin: 12px auto 10px; border-radius: 2px;
  }
  .main-tagline {
    font-size: 12px; color: rgba(253,248,240,0.55);
    letter-spacing: 3px; text-transform: uppercase;
  }

  .main-qr {
    background: #fdf8f0;
    border-radius: 14px;
    padding: 16px;
    z-index: 1;
  }
  .main-qr img { width: 220px; height: 220px; display:block; }

  .main-bottom { text-align:center; z-index:1; }
  .main-url {
    font-size: 18px; color: #c8860a; letter-spacing: 2px;
    font-family: Arial, sans-serif; margin-bottom: 6px;
  }
  .main-sub {
    font-size: 10px; color: rgba(253,248,240,0.4);
    letter-spacing: 2px; text-transform: uppercase;
  }

  /* ── CARD 2: Commonwealth Joe ── */
  .card-cwj {
    width: 5in;
    height: 7in;
    background: #f5efe6;
    border-radius: 18px;
    border: 3px solid #3b2510;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 0.45in 0.4in 0.35in;
    position: relative;
    overflow: hidden;
  }

  /* Kraft paper texture overlay */
  .card-cwj::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(150,100,50,0.03) 3px, rgba(150,100,50,0.03) 4px
    );
    border-radius: 16px;
  }

  .cwj-top { text-align:center; z-index:1; }
  .cwj-partner {
    font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
    color: #8b6040; margin-bottom: 8px;
  }
  .cwj-featured {
    font-size: 13px; color: #3b2510; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 4px;
    font-family: Arial, sans-serif; font-weight: bold;
  }
  .cwj-name {
    font-size: 26px; color: #3b2510; letter-spacing: 1px;
    font-weight: normal; line-height: 1.2; text-align: center;
  }
  .cwj-rule {
    width: 36px; height: 2px; background: #8b6040;
    margin: 10px auto; border-radius: 2px;
  }
  .cwj-sub {
    font-size: 11px; color: #8b6040; letter-spacing: 2px;
    text-transform: uppercase;
  }

  .cwj-qr {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    border: 1.5px solid rgba(59,37,16,0.12);
    z-index: 1;
  }
  .cwj-qr img { width: 220px; height: 220px; display:block; }

  .cwj-bottom { text-align:center; z-index:1; }
  .cwj-on-tap {
    font-size: 11px; color: #8b6040; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .cwj-cedar {
    font-size: 13px; color: #3b2510; letter-spacing: 3px;
    text-transform: uppercase; font-family: Arial, sans-serif;
  }
  .cwj-url {
    font-size: 11px; color: rgba(59,37,16,0.4);
    letter-spacing: 1px; margin-top: 4px;
    font-family: Arial, sans-serif;
  }

  .print-btn {
    display:block; margin:24px auto 0;
    padding:12px 36px;
    background:#2d1b0e; color:#fff;
    border:none; border-radius:50px;
    font-size:16px; cursor:pointer;
    font-family:Arial,sans-serif;
  }
  .hint {
    text-align:center; font-size:11px; color:#999;
    font-family:Arial,sans-serif; margin-top:12px;
  }
</style>
</head>
<body>

<div class="sheet">

  <!-- CARD 1: Cedar Tap Main Site -->
  <div class="card-main">
    <div class="main-top">
      <div class="main-wordmark">Mobile Tap Room</div>
      <div class="main-title">Cedar Tap</div>
      <div class="main-rule"></div>
      <div class="main-tagline">Craft Beverages On Tap</div>
    </div>

    <div class="main-qr">
      <img src="img/qr-site-cedartaps.svg" alt="Cedar Tap QR">
    </div>

    <div class="main-bottom">
      <div class="main-url">cedartaps.com</div>
      <div class="main-sub">Scan to view full menu &amp; order</div>
    </div>
  </div>

  <!-- CARD 2: Commonwealth Joe -->
  <div class="card-cwj">
    <div class="cwj-top">
      <div class="cwj-partner">Featured Partner</div>
      <div class="cwj-featured">Commonwealth Joe</div>
      <div class="cwj-name">Nitro Cold Brew<br>On Tap</div>
      <div class="cwj-rule"></div>
      <div class="cwj-sub">Locally roasted · Served cold</div>
    </div>

    <div class="cwj-qr">
      <img src="img/qr-cwj-menu.svg" alt="CWJ Menu QR">
    </div>

    <div class="cwj-bottom">
      <div class="cwj-on-tap">Poured by</div>
      <div class="cwj-cedar">Cedar Tap</div>
      <div class="cwj-url">cedartaps.com/cwj</div>
    </div>
  </div>

</div>

<button class="print-btn no-print" onclick="window.print()">🖨 Print 5×7 Cards</button>
<div class="hint no-print">Print on cardstock · Cut along card borders · Tape or display at trailer</div>

</body>
</html>
