<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f0ede8; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:24px; font-family:'Inter',sans-serif; }
  .card { width:340px; background:#fdf8f0; border-radius:20px; overflow:hidden; box-shadow:0 12px 48px rgba(0,0,0,0.18); }
  .header { background:#2d5a1b; padding:20px 24px 16px; text-align:center; }
  .brand { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.7); font-weight:600; margin-bottom:4px; }
  .product { font-size:24px; font-weight:900; color:#fff; }
  .size-tag { display:inline-block; background:rgba(255,255,255,0.2); color:#fff; font-size:11px; font-weight:700; letter-spacing:0.1em; padding:3px 10px; border-radius:20px; margin-top:8px; }
  .body { padding:24px; display:flex; flex-direction:column; align-items:center; }
  .qr-frame { background:#fff; border-radius:12px; padding:10px; border:2px solid #e8d5b0; }
  .qr-frame svg { display:block; }
  .price { font-size:52px; font-weight:900; color:#1a0f08; letter-spacing:-2px; margin-top:18px; }
  .scan-label { font-size:12px; color:#8a6a3a; margin-top:6px; letter-spacing:0.06em; }
  .divider { display:flex; align-items:center; gap:10px; width:100%; margin:18px 0 14px; }
  .divider-line { flex:1; height:1px; background:#e0d0b8; }
  .divider-text { font-size:11px; color:#b0926a; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; }
  .cashapp-btn {
    display:block; width:100%; text-align:center; text-decoration:none;
    background:#00c244; color:#fff; font-size:15px; font-weight:800;
    padding:14px 20px; border-radius:12px; letter-spacing:0.02em;
    transition:opacity 0.15s;
  }
  .cashapp-btn:hover { opacity:0.88; }
  .cashapp-sub { font-size:11px; font-weight:500; opacity:0.85; display:block; margin-top:2px; }
  .footer { border-top:1px solid #e8d5b0; padding:12px 24px; display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  .foot-text { font-size:10px; color:#b0926a; letter-spacing:0.08em; text-transform:uppercase; }
  .dot { width:6px; height:6px; border-radius:50%; background:#2d5a1b; }
</style>
</head>
